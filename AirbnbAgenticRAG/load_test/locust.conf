# Locust configuration — Airbnb Agentic RAG
# ==========================================
# Default settings used when running: locust -f load_test/locustfile.py
#
# Override any setting on the command line:
#   locust --users=50 --run-time=10m
#
# The host must always be set via --host or RAG_API_URL env var:
#   locust -f load_test/locustfile.py --host=$RAG_API_URL

# ----- Test scale --------------------------------------------------------
# Smoke  test: users=5,  spawn-rate=1, run-time=1m
# Load   test: users=20, spawn-rate=2, run-time=5m   ← default below
# Stress test: users=50, spawn-rate=5, run-time=10m

users       = 20
spawn-rate  = 2
run-time    = 5m

# ----- Output ------------------------------------------------------------
html        = load_test/results/report.html
csv         = load_test/results/stats

# ----- Behaviour ---------------------------------------------------------
# Stop when >10% of requests fail (catches catastrophic failure fast)
stop-timeout            = 30
exit-code-on-error      = 1

# Print stats in the terminal every 15 seconds
print-stats-in-the-console = true
reset-stats             = false

# ----- Web UI (interactive mode only) ------------------------------------
# Access at http://localhost:8089 when not running --headless
web-port    = 8089
